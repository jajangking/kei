<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="monospace" font-size="11">
  <style>
    text { fill: #e0e0e0; }
    .label { fill: #888; font-size: 9px; }
    .wire { stroke: #555; stroke-width: 1.5; fill: none; }
    .wire5v { stroke: #ef4444; stroke-width: 2; fill: none; }
    .wire33 { stroke: #f97316; stroke-width: 2; fill: none; }
    .wiregnd { stroke: #222; stroke-width: 2; fill: none; }
    .wiregpio { stroke: #22c55e; stroke-width: 2; fill: none; }
    .box { fill: #1a1a2e; stroke: #333; stroke-width: 1.5; rx: 6; }
    .box-title { fill: #e94560; font-size: 10px; font-weight: bold; }
    .pin { fill: #2d2d5e; stroke: #555; }
    .pin-label { fill: #aaa; font-size: 8px; }
    .dot { fill: #e94560; }
    .r { fill: #2d2d5e; stroke: #555; rx: 3; }
  </style>

  <!-- ESP32 -->
  <rect class="box" x="20" y="20" width="200" height="340"/>
  <text x="120" y="42" text-anchor="middle" class="box-title">ESP32 DEV</text>

  <rect class="pin" x="30" y="55" width="70" height="14"/>
  <text x="40" y="65" class="pin-label">5V</text>
  <rect class="pin" x="30" y="75" width="70" height="14"/>
  <text x="40" y="85" class="pin-label">3.3V</text>
  <rect class="pin" x="30" y="95" width="70" height="14"/>
  <text x="40" y="105" class="pin-label">GND</text>

  <text class="label" x="30" y="135">I2C:</text>
  <rect class="pin" x="30" y="142" width="70" height="14"/>
  <text x="40" y="152" class="pin-label">GPIO21 (SDA)</text>
  <rect class="pin" x="30" y="160" width="70" height="14"/>
  <text x="40" y="170" class="pin-label">GPIO22 (SCL)</text>

  <text class="label" x="30" y="200">Motor A:</text>
  <rect class="pin" x="30" y="207" width="70" height="14"/>
  <text x="40" y="217" class="pin-label">GPIO25 (PWMA)</text>
  <rect class="pin" x="30" y="225" width="70" height="14"/>
  <text x="40" y="235" class="pin-label">GPIO26 (AIN1)</text>
  <rect class="pin" x="30" y="243" width="70" height="14"/>
  <text x="40" y="253" class="pin-label">GPIO27 (AIN2)</text>

  <text class="label" x="30" y="283">Motor B:</text>
  <rect class="pin" x="30" y="290" width="70" height="14"/>
  <text x="40" y="300" class="pin-label">GPIO13 (PWMB)</text>
  <rect class="pin" x="30" y="308" width="70" height="14"/>
  <text x="40" y="318" class="pin-label">GPIO14 (BIN1)</text>
  <rect class="pin" x="30" y="326" width="70" height="14"/>
  <text x="40" y="336" class="pin-label">GPIO33 (BIN2)</text>

  <!-- VL53L0X -->
  <rect class="box" x="320" y="20" width="180" height="170"/>
  <text x="410" y="42" text-anchor="middle" class="box-title">VL53L0X</text>

  <rect class="pin" x="410" y="60" width="80" height="14"/>
  <text x="420" y="70" class="pin-label">VIN</text>
  <rect class="pin" x="410" y="80" width="80" height="14"/>
  <text x="420" y="90" class="pin-label">GND</text>
  <rect class="pin" x="410" y="100" width="80" height="14"/>
  <text x="420" y="110" class="pin-label">SDA</text>
  <rect class="pin" x="410" y="120" width="80" height="14"/>
  <text x="420" y="130" class="pin-label">SCL</text>
  <rect class="pin" x="410" y="140" width="80" height="14"/>
  <text x="420" y="150" class="pin-label">XSHUT</text>

  <!-- Wires ESP32 → VL53L0X -->
  <path class="wire5v" d="M100,62 L380,67"/>
  <text x="240" y="58" fill="#ef4444" font-size="8">5V</text>
  <path class="wiregnd" d="M100,102 L380,87"/>
  <text x="240" y="100" fill="#222" font-size="8">GND</text>
  <path class="wiregpio" d="M100,149 L380,107"/>
  <text x="240" y="140" fill="#22c55e" font-size="8">SDA (21)</text>
  <path class="wiregpio" d="M100,167 L380,127"/>
  <text x="240" y="165" fill="#22c55e" font-size="8">SCL (22)</text>
  <path class="wire33" d="M100,82 L395,147"/>
  <text x="230" y="120" fill="#f97316" font-size="8">3.3V→XSHUT</text>

  <!-- TB6612 -->
  <rect class="box" x="320" y="220" width="200" height="240"/>
  <text x="420" y="242" text-anchor="middle" class="box-title">TB6612 MOTOR DRV</text>

  <rect class="pin" x="410" y="258" width="80" height="14"/>
  <text x="420" y="268" class="pin-label">VM (power motor)</text>
  <rect class="pin" x="410" y="278" width="80" height="14"/>
  <text x="420" y="288" class="pin-label">VCC (logic)</text>
  <rect class="pin" x="410" y="298" width="80" height="14"/>
  <text x="420" y="308" class="pin-label">GND</text>
  <rect class="pin" x="410" y="318" width="80" height="14"/>
  <text x="420" y="328" class="pin-label">STBY</text>

  <text class="label" x="410" y="358">Motor A:</text>
  <rect class="pin" x="410" y="365" width="80" height="14"/>
  <text x="420" y="375" class="pin-label">PWMA</text>
  <rect class="pin" x="410" y="383" width="80" height="14"/>
  <text x="420" y="393" class="pin-label">AIN1</text>
  <rect class="pin" x="410" y="401" width="80" height="14"/>
  <text x="420" y="411" class="pin-label">AIN2</text>
  <rect class="pin" x="410" y="419" width="80" height="14"/>
  <text x="420" y="429" class="pin-label">A01 / A02 → Motor</text>

  <text class="label" x="410" y="450">Motor B:</text>
  <rect class="pin" x="410" y="455" width="80" height="14"/>
  <text x="420" y="465" class="pin-label">B01 / B02 → Motor</text>

  <!-- Wires ESP32 → TB6612 -->
  <path class="wire33" d="M100,82 L395,285"/>
  <text x="240" y="190" fill="#f97316" font-size="8">3.3V → VCC</text>
  <path class="wiregnd" d="M100,102 L395,305"/>
  <text x="240" y="208" fill="#222" font-size="8">GND</text>
  <path class="wire33" d="M100,82 C170,340 300,340 395,325"/>
  <text x="250" y="350" fill="#f97316" font-size="8">3.3V → STBY</text>

  <path class="wiregpio" d="M100,214 L395,372"/>
  <text x="250" y="370" fill="#22c55e" font-size="8">25 → PWMA</text>
  <path class="wiregpio" d="M100,232 L395,390"/>
  <text x="250" y="388" fill="#22c55e" font-size="8">26 → AIN1</text>
  <path class="wiregpio" d="M100,250 L395,408"/>
  <text x="250" y="406" fill="#22c55e" font-size="8">27 → AIN2</text>

  <path class="wiregpio" d="M100,297 L395,462"/>
  <text x="250" y="460" fill="#22c55e" font-size="8">13 → PWMB</text>
  <path class="wiregpio" d="M100,315 L395,480"/>
  <text x="250" y="478" fill="#22c55e" font-size="8">14 → BIN1</text>
  <path class="wiregpio" d="M100,333 L395,498"/>
  <text x="250" y="496" fill="#22c55e" font-size="8">33 → BIN2</text>

  <!-- Battery -->
  <rect class="box" x="620" y="20" width="160" height="100"/>
  <text x="700" y="42" text-anchor="middle" class="box-title">BATERE 7.4V</text>
  <rect class="pin" x="660" y="60" width="80" height="14"/>
  <text x="670" y="70" class="pin-label">(+)</text>
  <rect class="pin" x="660" y="80" width="80" height="14"/>
  <text x="670" y="90" class="pin-label">(-)</text>

  <!-- Batere → VM -->
  <path class="wire5v" d="M660,67 L535,265"/>
  <text x="590" y="165" fill="#ef4444" font-size="8">VM (motor power)</text>

  <!-- Batere → GPIO34 voltage divider -->
  <rect class="r" x="660" y="140" width="36" height="16"/>
  <text x="668" y="151" fill="#e0e0e0" font-size="8">R1</text>
  <rect class="r" x="660" y="180" width="36" height="16"/>
  <text x="668" y="191" fill="#e0e0e0" font-size="8">R2</text>
  <text x="680" y="140" class="label">440Ω (2×220)</text>
  <text x="680" y="180" class="label">220Ω</text>

  <path class="wire" d="M660,67 L678,140"/>
  <path class="wire" d="M678,156 L678,180"/>
  <path class="wire" d="M678,196 L678,240 L350,240 L350,60" stroke="#ef4444"/>
  <text x="520" y="238" fill="#ef4444" font-size="8">ke TB6612 VM</text>
  <path class="wire" d="M696,147 L720,147 L720,530" stroke="#22c55e"/>
  <text x="722" y="400" fill="#22c55e" font-size="8">→ GPIO34</text>
  <path class="wiregnd" d="M696,188 L720,188 L720,550 L520,550 L520,305"/>
  <text x="722" y="550" fill="#222" font-size="8">GND</text>

  <!-- MOTORS -->
  <rect class="box" x="620" y="260" width="160" height="80"/>
  <text x="700" y="282" text-anchor="middle" class="box-title">MOTOR KIRI</text>
  <rect class="pin" x="660" y="300" width="80" height="14"/>
  <text x="670" y="310" class="pin-label">+ / -</text>

  <rect class="box" x="620" y="360" width="160" height="80"/>
  <text x="700" y="382" text-anchor="middle" class="box-title">MOTOR KANAN</text>
  <rect class="pin" x="660" y="400" width="80" height="14"/>
  <text x="670" y="410" class="pin-label">+ / -</text>

  <path class="wire" d="M520,426 L620,307"/> <!-- TB6612 B → motor kanan -->
  <path class="wire" d="M520,426 L620,407"/>
  <path class="wire" d="M520,426 L620,307"/>
  <path class="wire" d="M520,426 L620,407"/>

  <!-- Buzzer -->
  <rect class="box" x="620" y="480" width="160" height="90"/>
  <text x="700" y="502" text-anchor="middle" class="box-title">BUZZER</text>
  <rect class="pin" x="660" y="520" width="80" height="14"/>
  <text x="670" y="530" class="pin-label">I/O</text>
  <rect class="pin" x="660" y="540" width="80" height="14"/>
  <text x="670" y="550" class="pin-label">VCC</text>

  <path class="wiregpio" d="M100,440 C110,520 660,520 660,527"/>
  <text x="350" y="545" fill="#22c55e" font-size="8">GPIO4 → I/O</text>
  <path class="wire33" d="M100,82 C110,630 630,630 660,547"/>
  <text x="350" y="600" fill="#f97316" font-size="8">3.3V → VCC</text>
</svg>
