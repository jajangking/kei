name: Build Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: pio-${{ runner.os }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: set -o pipefail; pio run -d esp32 2>&1 | tee /tmp/pio_output.txt

      - name: Upload error log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/pio_output.txt

      - name: Stage binaries
        if: success()
        run: |
          mkdir -p /tmp/release
          cp esp32/.pio/build/esp32dev/bootloader.bin /tmp/release/
          cp esp32/.pio/build/esp32dev/partitions.bin /tmp/release/
          cp esp32/.pio/build/esp32dev/firmware.bin /tmp/release/
          ls -la /tmp/release/

      - name: Upload all binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-full
          path: /tmp/release/*.bin

      - name: Create Release
        if: success() && github.ref == 'refs/heads/main'
        run: |
          gh release create "build-${{ github.run_number }}" \
            /tmp/release/bootloader.bin \
            /tmp/release/partitions.bin \
            /tmp/release/firmware.bin \
            --repo "${{ github.repository }}" \
            --title "Firmware Build #${{ github.run_number }}" \
            --notes "Firmware build from commit ${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
