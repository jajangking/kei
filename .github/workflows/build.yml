name: Build Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: pio-${{ runner.os }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run 2>&1 | tee /tmp/pio_output.txt

      - name: Upload error log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/pio_output.txt

      - name: Upload binary artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/esp32dev/firmware.bin

      - name: Create Release
        if: success() && github.ref == 'refs/heads/main'
        run: |
          gh release create "build-${{ github.run_number }}" \
            .pio/build/esp32dev/firmware.bin \
            --repo "${{ github.repository }}" \
            --title "Firmware Build #${{ github.run_number }}" \
            --notes "Firmware build from commit ${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
