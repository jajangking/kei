name: Build Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: pio-${{ runner.os }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run 2>&1 | tee /tmp/pio_output.txt

      - name: Upload error log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/pio_output.txt

      - name: Upload binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/esp32dev/firmware.bin
